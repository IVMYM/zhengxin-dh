# 用法（服务器上）：cd ~/zhengxin-dh && docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# 只绑定本机回环和 Tailscale 地址，不暴露到公网（0.0.0.0）。
name: zhengxin-dh
services:
  zhengxin-dh:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zhengxin-dh:local
    container_name: zhengxin-dh
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"   # 与宿主 runtime/ 目录属主一致
    env_file:
      - ../.env            # LLM_*、ADMIN_PASSWORD 等（chmod 600，不入库、不进镜像）
    environment:
      TZ: Asia/Shanghai          # 只影响日志时间；回答里的日期一律按北京时间计算，与此无关
      HOST: 0.0.0.0
      PORT: "43200"
      # 只信这些直连地址带来的 X-Real-IP / X-Forwarded-For。Docker 端口转发后，nginx / tailscale serve 的请求
      # 在容器里显示为 Docker 网关地址，所以部署脚本会把网关地址写进 .env 的 TRUSTED_PROXIES。
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1,::1}"
    ports:
      - "127.0.0.1:43200:43200"
      - "${TS_BIND_IP:-127.0.0.1}:${TS_BIND_PORT:-43201}:43200"
    volumes:
      - ../runtime/data:/app/data
      - ../runtime/cache:/app/cache
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

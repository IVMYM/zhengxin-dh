<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>话术播单 · 现场操作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/panel.css">
</head>
<body>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add("embed");</script>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <div class="title">话术播单</div>
          <div class="sub" id="plName">征信展厅话术</div>
        </div>
      </div>
      <div class="top-actions">
        <a class="ghost" href="/" target="_blank" rel="noopener">打开展厅屏</a>
        <span class="pill" id="linkPill">未连接展厅</span>
      </div>
    </header>

    <main class="layout">
      <section class="list-pane">
        <div class="toolbar">
          <button type="button" id="btnAdd">＋ 添加</button>
          <button type="button" id="btnImport">导入</button>
          <button type="button" class="primary" id="btnSynth">全部合成</button>
          <button type="button" id="btnRefresh" title="刷新状态">↻</button>
        </div>
        <div class="synth-bar" id="synthBar" hidden>
          <div class="synth-track"><i id="synthFill"></i></div>
          <div class="synth-txt" id="synthTxt">准备合成…</div>
        </div>
        <ul class="tracks" id="tracks" aria-label="话术列表"></ul>
        <div class="hint">拖拽左侧竖线可调整顺序；双击条目可编辑。展厅屏口型会跟着当前播放的声音走。</div>
      </section>

      <section class="player-pane">
        <div class="now">
          <div class="now-label">正在播放</div>
          <div class="now-title" id="nowTitle">—</div>
          <div class="now-text" id="nowText">选择一条话术，或点播放。</div>
        </div>
        <div class="progress">
          <span id="tCur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1">
          <span id="tDur">0:00</span>
        </div>
        <div class="transport">
          <button type="button" id="btnPrev" title="上一首">⏮</button>
          <button type="button" class="play" id="btnPlay" title="播放/暂停">▶</button>
          <button type="button" id="btnNext" title="下一首">⏭</button>
        </div>
        <div class="modes" id="modes">
          <button type="button" data-mode="sequence">顺序</button>
          <button type="button" data-mode="loop" class="on">列表循环</button>
          <button type="button" data-mode="single">单曲循环</button>
          <button type="button" data-mode="shuffle">随机</button>
        </div>
        <div class="sliders">
          <label>间隔 <input type="range" id="gap" min="0" max="5000" step="100" value="800"><em id="gapVal">0.8s</em></label>
          <label>音量 <input type="range" id="vol" min="0" max="100" value="100"><em id="volVal">100%</em></label>
        </div>
        <label class="check"><input type="checkbox" id="autostart"> 展厅屏加载后自动播放（默认关）</label>
        <div class="status" id="status">就绪</div>
      </section>
    </main>
  </div>

  <dialog id="editDlg">
    <form method="dialog" id="editForm">
      <h3 id="editTitle">编辑话术</h3>
      <label>标题 <input id="fTitle" maxlength="80" required></label>
      <label>正文 <textarea id="fText" rows="5" maxlength="800" required></textarea></label>
      <label>音色
        <select id="fVoice">
          <option value="female">女声 · 晓晓</option>
          <option value="female2">女声 · 晓伊</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="fEnabled" checked> 启用（关闭则跳过）</label>
      <div class="dlg-actions">
        <button type="button" id="btnDelete" class="danger" hidden>删除</button>
        <span style="flex:1"></span>
        <button type="button" id="btnCancel" value="cancel">取消</button>
        <button type="submit" class="primary" value="ok">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="loginDlg">
    <form method="dialog" id="loginForm">
      <h3>管理员登录</h3>
      <p class="muted">编辑、合成和播放控制需要管理员密码。</p>
      <label>密码 <input type="password" id="loginPw" autocomplete="current-password" required></label>
      <div class="muted" id="loginErr" hidden></div>
      <div class="dlg-actions">
        <span style="flex:1"></span>
        <button type="button" id="loginCancel">取消</button>
        <button type="submit" class="primary">登录</button>
      </div>
    </form>
  </dialog>

  <dialog id="importDlg">
    <form method="dialog" id="importForm">
      <h3>批量导入</h3>
      <p class="muted">每行一条。支持「标题|正文」「标题,正文」或纯正文。也可选择 .txt / .csv 文件。</p>
      <textarea id="importText" rows="10" placeholder="查询收费|通过互联网渠道查询是免费的。&#10;不良记录保存五年。"></textarea>
      <input type="file" id="importFile" accept=".txt,.csv,text/plain,text/csv">
      <label class="check"><input type="checkbox" id="importReplace"> 替换当前列表（否则追加）</label>
      <div class="dlg-actions">
        <span style="flex:1"></span>
        <button type="button" id="importCancel">取消</button>
        <button type="submit" class="primary">导入</button>
      </div>
    </form>
  </dialog>

  <script src="/panel.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>征信服务区 · 智能服务助理</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="viewport">
  <div id="app" class="mode-attract no-text">

    <!-- 右上角：悬停显示，VS Code 风格展开/收回管理端 -->
    <div class="layout-toggle-zone" id="layoutToggleZone">
      <span class="fs-note" id="fsNote" role="status" aria-live="polite" hidden></span>
      <button type="button" class="layout-toggle fs-toggle" id="fsToggle" aria-label="全屏" aria-pressed="false" title="全屏（F）">
        <svg class="ico-fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
        <svg class="ico-fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 4h2v6H4V8h4V4zm6 0h2v4h4v2h-6V4zM4 14h6v6H8v-4H4v-2zm10 0h6v2h-4v4h-2v-6z"/></svg>
      </button>
      <button type="button" class="layout-toggle" id="layoutToggle" aria-label="展开管理端" aria-pressed="false" title="展开或收回话术管理">
        <svg class="ico-expand" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 4h7v16H3V4zm9 0h9v2h-9V4zm0 5h9v2h-9V9zm0 5h9v2h-9v-2zm0 5h9v2h-9v-2z"/></svg>
        <svg class="ico-collapse" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 4h7v16h-7V4zM3 4h9v2H3V4zm0 5h9v2H3V9zm0 5h9v2H3v-2zm0 5h9v2H3v-2z"/></svg>
      </button>
    </div>

    <aside class="script-drawer" id="scriptDrawer" aria-hidden="true">
      <div class="drawer-head">
        <div>
          <div class="drawer-title">话术清单</div>
          <div class="drawer-sub">左侧管理 · 人物贴右</div>
        </div>
        <button type="button" class="drawer-close" id="drawerClose" aria-label="收回">收回</button>
      </div>
      <iframe id="drawerFrame" class="drawer-frame" title="话术播单" src="about:blank"></iframe>
    </aside>
    <div class="drawer-mask" id="drawerMask" hidden></div>

    <!-- 顶部信息栏 -->
    <header class="topbar">
      <div class="brand" id="brand" title="长按 2 秒打开设置">
        <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#fff" stroke="#1f4e79" stroke-width="3"/>
          <path d="M32 12 L48 19 V31 C48 41 41 48.5 32 52 C23 48.5 16 41 16 31 V19 Z" fill="#1f4e79"/>
          <path d="M24.5 31.5 L30 37 L40.5 26" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text">
          <div class="brand-name" id="siteName">征信服务区</div>
          <div class="brand-sub" id="siteSub">个人信用报告查询 · 异议受理 · 信用知识普及</div>
        </div>
      </div>
      <div class="clock">
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate"></div>
      </div>
    </header>

    <!-- 数字人舞台 -->
    <section class="stage" id="stage">
      <div class="stage-bg"></div>
      <video id="vStageFill" class="stage-fill" src="/media/avatar_idle.mp4" muted loop playsinline autoplay preload="auto"></video>
      <div class="avatar" id="avatar">
        <video id="vIdle" src="/media/avatar_idle.mp4" poster="/media/avatar_poster.jpg" muted loop playsinline autoplay preload="auto"></video>
        <video id="vTalk" src="/media/avatar_talk.mp4" muted loop playsinline preload="auto"></video>
        <video id="vLip" muted playsinline preload="auto"></video>
        <canvas id="vFade" width="720" height="1280"></canvas>
      </div>
      <div class="presence" id="presence"><i></i><span id="presenceText">小信 · 在线服务</span></div>

      <aside class="panel" id="panel" aria-live="polite"></aside>

      <!-- 右下角麦克风按钮已移除：改用底部中央麦克风对话按钮 -->
      <!-- 底部中央：悬停/点触显示；单击开始聆听→识别→回答，再点结束 -->
      <div class="mic-power-zone" id="micPowerZone">
        <div class="mic-hint" id="micHint" hidden></div>
        <button type="button" class="mic-power" id="micPower" data-state="idle" aria-label="点击说话">
          <svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="mic-power-label" id="micPowerLabel">点击说话</span>
        </button>
      </div>
      <div class="drawer-edge" id="drawerEdge" title=""></div>
      <div class="hot" id="hot"></div>
      <video id="vPreIdle" muted playsinline preload="auto" hidden></video>
      <video id="vPreTalk" muted playsinline preload="auto" hidden></video>

      <div class="subtitle" id="subtitle"><span class="sub-who">小信</span><span class="sub-text" id="subText"></span></div>
    </section>

    <!-- 交互区 -->
    <section class="console" id="console">
      <div class="utter" id="utter"><span class="utter-who">您</span><span class="utter-text" id="utterText">请点击下方按钮说话，或直接点选问题</span></div>

      <div class="suggest">
        <div class="suggest-head"><span id="suggestLabel">您可以这样问我</span><button class="link-btn" id="moreBtn" type="button">换一批</button></div>
        <div class="chips" id="chips"></div>
      </div>

      <form class="textbar" id="textbar" autocomplete="off">
        <input id="textInput" maxlength="100" placeholder="请输入您想咨询的问题">
        <button type="submit" class="send">发送</button>
        <button type="button" class="close" id="textClose" aria-label="收起">收起</button>
      </form>

      <div class="controls">
        <button class="side-btn" id="kbBtn" type="button">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 10h1M9.5 10h1M13 10h1M16.5 10h1M6 13.5h1M17 13.5h1M9 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>文字输入</span>
        </button>
        <div class="mic-wrap">
          <button class="mic" id="micBtn" type="button" aria-label="说话">
            <span class="mic-ring"></span>
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <div class="mic-status" id="micStatus">点击说话</div>
          <div class="level" id="level"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <button class="side-btn" id="guideBtn" type="button">
          <svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 7h7M8.5 10.5h7M8.5 14h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.5" cy="17.5" r="1.3" fill="currentColor"/></svg>
          <span>查询指引</span>
        </button>
      </div>

      <footer class="foot">
        <span>语音在本机识别，录音不上传 · 答复仅供参考，以网点公示为准</span>
        <span id="asrStatus">语音识别准备中</span>
      </footer>

      <!-- 待机吸引态 -->
      <div class="attract" id="attract">
        <div class="attract-hello">您好，我是征信服务助理<b>小信</b></div>
        <div class="attract-cta">轻触屏幕，或对我说 “你好”</div>
        <button type="button" class="voice-pill wait" id="voicePill"><i></i><span id="voiceText">语音唤醒准备中</span><em id="voiceHeard"></em></button>
        <div class="tip">
          <div class="tip-label">信用小知识</div>
          <div class="tip-title" id="tipTitle"></div>
          <div class="tip-desc" id="tipDesc"></div>
          <div class="tip-dots" id="tipDots"></div>
        </div>
        <div class="quick" id="quick">
          <span class="quick-label">常办业务</span>
          <button type="button" data-q="怎么查个人信用报告">个人信用报告查询</button>
          <button type="button" data-q="报告信息有错怎么办">异议申请</button>
          <button type="button" data-q="企业信用报告怎么查">企业征信查询</button>
          <button type="button" data-q="自助查询机怎么操作">自助机指引</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast"></div>

    <!-- 现场设置（长按左上角标识 2 秒） -->
    <div class="settings" id="settings" hidden>
      <div class="settings-box">
        <div class="settings-title">现场设置</div>
        <label>播报音色 <select id="setVoice"></select></label>
        <label>服装 <select id="setOutfit"></select></label>
        <label id="setSensitiveRow" hidden><input type="checkbox" id="setSensitive"> 显示敏感服装（加入点击轮换）</label>
        <label><input type="checkbox" id="setWake"> 语音唤醒（说“你好”唤醒）</label>
        <label>语音识别 <select id="setAsr"><option value="sherpa">本机离线识别</option><option value="webspeech">浏览器在线识别（需外网）</option><option value="off">关闭</option></select></label>
        <div class="settings-row">
          <button type="button" id="setFull">全屏 / 退出全屏</button>
          <button type="button" id="setClose" class="primary">完成</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/sync.js"></script>
<script src="/gate-core.js"></script>
<script src="/lipsync.js"></script>
<script src="/app.js"></script>
</body>
</html>
